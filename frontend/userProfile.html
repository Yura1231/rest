<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль користувача</title>
    <link rel="stylesheet" href="userProfile.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo">HANDY</div>
        <nav class="nav-links">
            <a href="index.html">Головна</a>
            <a href="#">Події</a>
            <a href="#">Про нас</a>
            <a href="#">Контакти</a>
        </nav>
        <button class="btn btn-outline-dark">Увійти | Зареєструватися</button>
    </header>

    <div class="container profile-container">
        <div>
            <h2 class="profile-header">Особистий профіль</h2>
            <img src="profilePhoto.jpg" alt="Фото користувача" class="profile-photo" id="profilePhoto">
            <input type="file" id="photoInput" style="display: none;">
        
            <div id="userNameWrapper">
                <h3 id="userName">Ім'я Прізвище</h3>
                <input type="text" id="nameInput" class="input-field" value="Ім'я Прізвище" style="display: none;">
            </div>
        
            <button class="edit-btn" id="editNameBtn">Редагувати</button>
        </div>
        <div class="profile-info">
            <div>
                <input type="text" id="content" class="input-field" placeholder="Чим займається користувач" disabled>
                <button class="edit-btn">Редагувати</button>
            </div>
            <div>
                <input type="email" id="email" class="input-field" placeholder="Email" disabled>
                <button class="edit-btn">Редагувати</button>
            </div>
            
            <div>
                <input type="tel" id="number_phone" class="input-field" placeholder="Номер телефону" disabled>
                <button class="edit-btn">Редагувати</button>
            </div>
            <div>
                <input type="text" id="first_name" class="input-field" placeholder="Імя" disabled>
                <button class="edit-btn">Редагувати</button>
            </div>
            <div>
                <input type="text" id="last_name" class="input-field" placeholder="Прізвище" disabled>
                <button class="edit-btn">Редагувати</button>
            </div>
            <button class="help-btn">Потрібна допомога</button>
        </div>
    </div>

    <div class="tabs-container">
        <span class="tab active" data-tab="published">Публікували</span>
        <span class="tab" data-tab="helped">Допомогли</span>
        <span class="tab" data-tab="reviews">Відгуки</span>
        
        <div class="tab-content active" id="published">
            <div class="content-box">Тут будуть ваші публікації.</div>
        </div>
        <div class="tab-content" id="helped">
            <div class="content-box">Тут відображаються події на які ви погодилися.</div>
        </div>
        <div class="tab-content" id="reviews">
            <div class="content-box">Ваші відгуки.</div>
        </div>
    </div>

    <footer class="footer">
    </footer>
    <script src="userProfile.js"></script>
</body>
</html>
