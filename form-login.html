<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма для входу</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <div class="form-login">
            <h2>ВХІД ДО ОСОБИСТОГО КАБІНЕТУ</h2>
            <p class="p-login">Увійди та почни творити добрі справи</p>
            <form action="#" method="POST">
                
                    <div class="form-group">
                        <label for="email">Вкажіть електронну пошту</label>
                        <input class="register" type="email" id="email" name="email" placeholder="example@email.com">
                    </div>
            
                    <div class="form-group">
                        <label for="password">Вкажіть пароль</label>
                        <input class="register" type="password" id="password" name="password">
                    </div>
        
                    <button class="submit-btn button" type="submit">Увійти</button>
    
                    <p class="login-link">Не маєте профілю? <a class="form-link" href="#">Зареєструйтесь</a></p>
    
    
            </form>
    
    
        </div>
    </div>
    
    
</body>
</html>
