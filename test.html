            document.addEventListener('DOMContentLoaded', () => {
                const events = [
        {
            name: "Волонтерство у Львові",
            category: "Допомога",
            city: "Львів",
            district: "Личаківський",
            street: "вул. Чупринки, 110",
            startTime: "10:00",

        },

            name: "Еко-акція у Львові",
            category: "Екологія",
            city: "Львові",
            district: "Франківський",
            street: "вул. Володимира Великого, 22",
            startTime: "09:00",

            phone: "+380987654321",

            description: "Прибирання парків та скверів місті.",
            image: "https://via.placeholder.com/150"
        }
    ];


    const eventsList = document.getElementById('events-list');
    const categoryFilter = document.getElementById('category-filter');

    const categoryMapping = {
    "donate": "Донат",
    "ecology": "Екологія",
    "military": "Військове",
    "help": "Допомога",
    "education": "Освіта",

    "refugees": "Допомога переселенцям",
    "community": "Громадська діяльність",

    "food-aid": "Харчова допомога",
    "legal-aid": "Юридична допомога"
};

// Функція для фільтрації подій за категорією
function filterEvents(category) {
    eventsList.innerHTML = ''; // Очищення списку подій перед відображенням

    events.forEach(event => {
        // Перевіряємо, чи обрана категорія або показуємо всі події
        if (category === 'all' || categoryMapping[category] === event.category) {
            const eventCard = `
                <div class="event-card">
                    <img src="${event.image}" alt="${event.name}">
                    <div class="event-content">
                        <h2>${event.name}</h2>
                        <p><strong>Категорія:</strong> ${event.category}</p>
                        <p><strong>Місце:</strong> ${event.city}, ${event.district}, ${event.street}</p>
                        <p><strong>Час:</strong> ${event.startTime} - ${event.endTime}</p>
                        <p><strong>Телефон:</strong> ${event.phone}</p>
                        <p><strong>Email:</strong> ${event.email}</p>
                        <p><strong>Опис:</strong> ${event.description}</p>
                    </div>
                </div>
            `;
            eventsList.innerHTML += eventCard;
        }
    });
}
    // Виклик функції фільтрації за зміною обраної категорії
    categoryFilter.addEventListener('change', () => {
        filterEvents(categoryFilter.value);
    });
    filterEvents('all');
});

categoryFilter.addEventListener('change', () => {
    eventsList.style.opacity = '0'; // Зникнення перед зміною
    setTimeout(() => {
        filterEvents(categoryFilter.value);
        eventsList.style.opacity = '1'; // Плавне повернення
    }, 300);
});
